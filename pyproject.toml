# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[build-system]
requires = ["setuptools>=68.2,<83", "wheel"]

# START-MARKER-MANUAL-CONFIG
# Anything from here until END-MARKER-MANUAL-CONFIG
# will be kept by plone.meta

[project]
name = "plone.app.mosaic"
version = "4.2.3.dev0"
description = "Plone Mosaic Site Builder and Site Layout"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Framework :: Zope :: 5",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "GPL-2.0-only"
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Plone Foundation",email = "foundation@plone.org"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "plone-developers@lists.sourceforge.net"},
]
dependencies = [
    "Products.CMFCore",
    "Products.CMFPlone",
    "lxml",
    "plone.api",
    "plone.app.blocks",
    "plone.app.content",
    "plone.app.contentmenu",
    "plone.app.contenttypes",
    "plone.app.dexterity",
    "plone.app.drafts",
    "plone.app.layout",
    "plone.app.standardtiles",
    "plone.app.tiles",
    "plone.app.z3cform",
    "plone.autoform",
    "plone.base",
    "plone.dexterity",
    "plone.i18n",
    "plone.indexer",
    "plone.memoize",
    "plone.portlets",
    "plone.protect",
    "plone.resource",
    "plone.supermodel",
    "plone.tiles",
    "plone.transformchain",
    "repoze.xmliter",
    "setuptools",
    "z3c.form",
]
keywords = [
    "Python",
    "Plone",
    "javascript",
    "mosaic",
    "grideditor",
]

[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[project.optional-dependencies]
test = [
    "plone.app.contenttypes",
    "plone.app.robotframework",
    "plone.app.testing",
    "plone.browserlayer",
    "plone.testing",
    "robotsuite",
]
docs = [
    "Sphinx",
    "myst-parser",
    "plone-sphinx-theme",
    "robotframework",
    "sphinx-copybutton",
    "sphinx-design",
]

[project.urls]
Source = "https://github.com/plone/plone.app.mosaic"
Issues = "https://github.com/plone/Products.CMFPlone/issues"
Changelog = "https://github.com/plone/plone.app.mosaic/blob/master/CHANGES.rst"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}
# END-MARKER-MANUAL-CONFIG

[tool.towncrier]
directory = "news/"
filename = "CHANGES.rst"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests:"
showcontent = true

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  towncrier_extra_lines = """
#  extra_configuration
#  """
##

[tool.isort]
profile = "plone"

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  isort_extra_lines = """
#  extra_configuration
#  """
##

[tool.black]
target-version = ["py311"]

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  black_extra_lines = """
#  extra_configuration
#  """
##

[tool.codespell]
ignore-words-list = "discreet,assertin,thet,foo,bar"
skip = "*.po,*.config.js,*.min.js,*.min.js.map,*.min.css.map,*.svg,pnpm-lock.yaml,*.json,*/tiles.xml"
##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  codespell_ignores = "foo,bar"
#  codespell_skip = "*.po,*.map,package-lock.json"
##

[tool.dependencychecker]
Zope = [
  # Zope own provided namespaces
  'App', 'OFS', 'Products.Five', 'Products.OFSP', 'Products.PageTemplates',
  'Products.SiteAccess', 'Shared', 'Testing', 'ZPublisher', 'ZTUtils',
  'Zope2', 'webdav', 'zmi',
  # ExtensionClass own provided namespaces
  'ExtensionClass', 'ComputedAttribute', 'MethodObject',
  # Zope dependencies
  'AccessControl', 'Acquisition', 'AuthEncoding', 'beautifulsoup4', 'BTrees',
  'cffi', 'Chameleon', 'DateTime', 'DocumentTemplate',
  'MultiMapping', 'multipart', 'PasteDeploy', 'Persistence', 'persistent',
  'pycparser', 'python-gettext', 'pytz', 'RestrictedPython', 'roman',
  'soupsieve', 'transaction', 'waitress', 'WebOb', 'WebTest', 'WSGIProxy2',
  'z3c.pt', 'zc.lockfile', 'ZConfig', 'zExceptions', 'ZODB', 'zodbpickle',
  'zope.annotation', 'zope.browser', 'zope.browsermenu', 'zope.browserpage',
  'zope.browserresource', 'zope.cachedescriptors', 'zope.component',
  'zope.configuration', 'zope.container', 'zope.contentprovider',
  'zope.contenttype', 'zope.datetime', 'zope.deferredimport',
  'zope.deprecation', 'zope.dottedname', 'zope.event', 'zope.exceptions',
  'zope.filerepresentation', 'zope.globalrequest', 'zope.hookable',
  'zope.i18n', 'zope.i18nmessageid', 'zope.interface', 'zope.lifecycleevent',
  'zope.location', 'zope.pagetemplate', 'zope.processlifetime', 'zope.proxy',
  'zope.ptresource', 'zope.publisher', 'zope.schema', 'zope.security',
  'zope.sequencesort', 'zope.site', 'zope.size', 'zope.structuredtext',
  'zope.tal', 'zope.tales', 'zope.testbrowser', 'zope.testing',
  'zope.traversing', 'zope.viewlet'
]
'Products.CMFCore' = [
  'docutils', 'five.localsitemanager', 'Missing', 'Products.BTreeFolder2',
  'Products.GenericSetup', 'Products.MailHost', 'Products.PythonScripts',
  'Products.StandardCacheManagers', 'Products.ZCatalog', 'Record',
  'zope.sendmail', 'Zope'
]
'plone.base' = [
  'plone.batching', 'plone.registry', 'plone.schema','plone.z3cform',
  'Products.CMFCore', 'Products.CMFDynamicViewFTI',
]
python-dateutil = ['dateutil']
pytest-plone = ['pytest', 'zope.pytestlayer', 'plone.testing', 'plone.app.testing']

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  dependencies_ignores = "['zestreleaser.towncrier']"
#  dependencies_mappings = [
#    "gitpython = ['git']",
#    "pygithub = ['github']",
